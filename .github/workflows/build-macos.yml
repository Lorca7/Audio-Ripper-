name: Build macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14        # Apple silicon (M1/M2/M3…)
            arch: arm64
          - runner: macos-15-intel  # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Tk
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build app
        env:
          PYTHON: python
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          ./packaging/build_mac.sh

      - name: Smoke test (headless core)
        run: |
          source .venv/bin/activate
          python packaging/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Ripper-macOS-${{ matrix.arch }}
          path: dist/Audio-Ripper-macOS-${{ matrix.arch }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Audio-Ripper-macOS-${{ matrix.arch }}.zip
